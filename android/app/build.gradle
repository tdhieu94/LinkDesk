plugins {
    id "com.android.application"
}

android {
    namespace "vn.linkdesk"
    compileSdk 34

    defaultConfig {
        applicationId "vn.linkdesk"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "0.10.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
